name: Terraform CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  TF_VERSION: "1.6.0"
  TFLINT_VERSION: "v0.50.0"

jobs:
  terraform-check:
    name: Terraform Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive -diff
        continue-on-error: false

      - name: Initialize Terraform (no backend)
        run: |
          cd environments/dev
          terraform init -backend=false

      - name: Validate Terraform configuration
        run: |
          cd environments/dev
          terraform validate

  tflint:
    name: TFLint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      - name: Initialize TFLint
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Run TFLint on modules
        run: |
          for dir in modules/*/; do
            echo "==> Linting $dir"
            tflint --chdir="$dir" --format=compact || true
          done

      - name: Run TFLint on environment
        run: |
          cd environments/dev
          tflint --format=compact

  checkov:
    name: Checkov Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          soft_fail: true
          output_format: cli
          skip_check: CKV_AWS_144,CKV_AWS_145,CKV2_AWS_5,CKV_AWS_18,CKV_AWS_21
          # Skipped checks:
          # CKV_AWS_144: S3 bucket cross-region replication (not needed for state bucket in dev)
          # CKV_AWS_145: S3 bucket KMS encryption (using AES256 is sufficient for this project)
          # CKV2_AWS_5: Security group not attached (SGs are attached via modules)
          # CKV_AWS_18: CloudWatch log group not encrypted (using default encryption)
          # CKV_AWS_21: S3 versioning already enabled

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [terraform-check, tflint, checkov]
    if: always()

    steps:
      - name: Check job results
        run: |
          echo "## CI Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Terraform Format & Validate | ${{ needs.terraform-check.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| TFLint | ${{ needs.tflint.result == 'success' && '✅ Passed' || '⚠️ Warnings' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Checkov Security | ${{ needs.checkov.result == 'success' && '✅ Passed' || '⚠️ Soft Fail' }} |" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.terraform-check.result }}" != "success" ]]; then
            echo ""
            echo "❌ **Terraform validation failed.** Please fix formatting and validation errors."
            exit 1
          fi

          echo ""
          echo "✅ **All critical checks passed!**"
